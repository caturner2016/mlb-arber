# ─────────────────────────────────────────────────
# MLB Arber — config
# ─────────────────────────────────────────────────

mode: live   # paper | live

# ── Kalshi credentials ────────────────────────────
kalshi_key_id:           ""
kalshi_private_key_path: ""

# ── Telegram alerts ───────────────────────────────
telegram_token:   ""
telegram_chat_id: ""

# ── Bot (main.py) feed speed ──────────────────────
poll_interval_sec: 0.5

# ── AT HOME profile ───────────────────────────────
# Buy up to 99¢ — hold to $1.00 settlement, no flip needed
home:
  max_buy_cents: 99
  max_hr_bet:    5.00
  max_hits_bet:  5.00

# ── AT THE GAME profile ───────────────────────────
# You see it first — buy up to 96¢, flip at 99¢
game:
  max_buy_cents: 96
  sell_cents:    99
  max_hr_bet:    5.00
  max_hits_bet:  5.00

# ── Risk ──────────────────────────────────────────
daily_loss_limit: 200
