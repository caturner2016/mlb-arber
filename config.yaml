mode: live   # paper | live

# ── Kalshi credentials ────────────────────────────
kalshi_key_id:           "1b7a51a0-6b45-4c07-b69e-c13490f31b5f"
kalshi_private_key_path: "kalshi_key.pem"

# ── Telegram alerts ───────────────────────────────
telegram_token:   "8717655973:AAEpX-PrS8pNENaT53p_DljRYWzutgevGxU"
telegram_chat_id: "1811240289"

# ── Bot (main.py) feed speed ──────────────────────
poll_interval_sec: 0.5

# ── AT HOME profile ───────────────────────────────
# Buy up to 99¢ — hold to $1.00 settlement, no flip needed
home:
  max_buy_cents: 99

# ── AT THE GAME profile ───────────────────────────
# You see it first — buy up to 96¢, flip at 99¢
game:
  max_buy_cents: 96
  sell_cents:    99

# ── NBA bot settings ──────────────────────────────
# Small bets — stat corrections are a real risk in NBA
nba:
  max_buy_cents: 99     # buy YES up to 99¢, hold to $1.00 settlement
  max_bet:       5.00   # keep small due to correction risk

# ── Pregame model settings ────────────────────────
# Auto-bets each morning based on model vs Kalshi price
model:
  max_buy_cents:  70    # only bet if Kalshi YES ask ≤ 70¢ (need edge)
  max_bet:       20.00  # max $ per pregame model bet
  min_edge_cents: 8     # only bet when model is ≥ 8¢ above Kalshi

# ── Weather bot settings ──────────────────────────
weather:
  max_buy_cents:              80    # only buy if Kalshi YES ask ≤ 80¢
  max_bet:                   10.00  # max $ per weather trade
  poll_interval_sec:          60    # NWS updates ~hourly, 60s is plenty
  min_confidence_margin_f:    1.0   # forecast must be ≥1°F inside range
  rain_buy_yes_threshold_pct: 80    # buy YES rain if NWS PoP ≥ 80%
  rain_buy_no_threshold_pct:  15    # skip rain if PoP ≤ 15%

# ── Risk ──────────────────────────────────────────
daily_loss_limit: 200
