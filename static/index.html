<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>MLB Arber</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
      padding: 16px;
      padding-bottom: 40px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-top: 8px;
    }

    h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
    h1 span { color: #22c55e; }

    #balance {
      font-size: 13px;
      color: #888;
      background: #1a1a1a;
      padding: 6px 12px;
      border-radius: 20px;
    }
    #balance b { color: #22c55e; }

    .section-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #555;
      margin-bottom: 8px;
    }

    /* Search + dropdown */
    .player-wrap { margin-bottom: 24px; }

    #search {
      width: 100%;
      padding: 14px 16px;
      font-size: 17px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      color: #fff;
      outline: none;
      margin-bottom: 8px;
    }
    #search::placeholder { color: #555; }
    #search:focus { border-color: #3a3a3a; }

    #player-list {
      max-height: 220px;
      overflow-y: auto;
      background: #1a1a1a;
      border-radius: 12px;
      border: 1px solid #2a2a2a;
    }

    .player-item {
      padding: 13px 16px;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #222;
      transition: background 0.1s;
    }
    .player-item:last-child { border-bottom: none; }
    .player-item:active, .player-item.selected { background: #252525; }
    .player-item.selected { border-left: 3px solid #22c55e; }

    .player-badges { display: flex; gap: 6px; }
    .badge {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-hr { background: #7f1d1d; color: #fca5a5; }
    .badge-hit { background: #1e3a5f; color: #93c5fd; }

    /* Selected player display */
    #selected-display {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 24px;
      font-size: 18px;
      font-weight: 600;
      color: #aaa;
      min-height: 52px;
    }
    #selected-display.active { color: #fff; border-color: #22c55e33; }

    /* Trade buttons */
    .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }

    .trade-btn {
      padding: 22px 12px;
      border: none;
      border-radius: 16px;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.1s;
      letter-spacing: 0.5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .trade-btn:active { transform: scale(0.96); }
    .trade-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

    .trade-btn small {
      font-size: 11px;
      font-weight: 500;
      opacity: 0.75;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #btn-hit {
      background: linear-gradient(135deg, #1d4ed8, #2563eb);
      color: #fff;
    }
    #btn-hr {
      background: linear-gradient(135deg, #b91c1c, #ef4444);
      color: #fff;
    }

    /* Result card */
    #result {
      border-radius: 14px;
      padding: 18px;
      font-size: 14px;
      line-height: 1.7;
      display: none;
    }
    #result.success { background: #052e16; border: 1px solid #166534; }
    #result.error   { background: #2d0c0c; border: 1px solid #7f1d1d; }
    #result.loading { background: #1a1a1a; border: 1px solid #2a2a2a; color: #888; }

    .result-row { display: flex; justify-content: space-between; }
    .result-row .label { color: #888; }
    .result-row .value { font-weight: 600; }
    .result-row .value.green { color: #22c55e; }
    .result-row .value.red   { color: #ef4444; }
    .result-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #22c55e;
    }
    .result-title.error-title { color: #ef4444; }

    /* Spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid #333;
      border-top-color: #22c55e;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }

    /* Mode badge */
    #mode-badge {
      display: inline-block;
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-left: 8px;
      vertical-align: middle;
    }
    .mode-paper { background: #713f12; color: #fde68a; }
    .mode-live  { background: #052e16; color: #86efac; }
  </style>
</head>
<body>

<header>
  <h1>MLB <span>Arber</span></h1>
  <div id="balance">Balance: <b id="bal-val">—</b></div>
</header>

<div class="player-wrap">
  <div class="section-label">Select Batter</div>
  <input id="search" type="text" placeholder="Search player..." autocomplete="off" autocorrect="off" spellcheck="false">
  <div id="player-list"></div>
</div>

<div id="selected-display">No player selected</div>

<div class="buttons">
  <button class="trade-btn" id="btn-hit" disabled onclick="trade('hit')">
    🟦 HIT
    <small>buy ≤96¢ → sell 99¢</small>
  </button>
  <button class="trade-btn" id="btn-hr" disabled onclick="trade('home_run')">
    🔴 HOME RUN
    <small>buy ≤96¢ → sell 99¢</small>
  </button>
</div>

<div id="result"></div>

<script>
  // ── State ──────────────────────────────────────────────────────────────────
  let allPlayers = [];
  let selectedPlayer = null;
  let mode = 'paper';

  // ── Init ───────────────────────────────────────────────────────────────────
  async function init() {
    await Promise.all([loadPlayers(), loadBalance()]);
  }

  async function loadBalance() {
    try {
      const r = await fetch('/api/balance');
      const d = await r.json();
      document.getElementById('bal-val').textContent = '$' + d.balance_usd.toFixed(2);
    } catch(e) {
      document.getElementById('bal-val').textContent = 'offline';
    }
  }

  async function loadPlayers() {
    try {
      const r = await fetch('/api/players');
      const d = await r.json();
      allPlayers = d.players;
      renderList(allPlayers);
    } catch(e) {
      document.getElementById('player-list').innerHTML =
        '<div class="player-item" style="color:#ef4444">Failed to load — check connection</div>';
    }
  }

  function renderList(players) {
    const el = document.getElementById('player-list');
    if (!players.length) {
      el.innerHTML = '<div class="player-item" style="color:#555">No players found</div>';
      return;
    }
    el.innerHTML = players.map(p => `
      <div class="player-item ${selectedPlayer?.name === p.name ? 'selected' : ''}"
           onclick="selectPlayer(${JSON.stringify(p).replace(/"/g, '&quot;')})">
        <span>${p.name}</span>
        <span class="player-badges">
          ${p.has_hr  ? '<span class="badge badge-hr">HR</span>' : ''}
          ${p.has_hit ? '<span class="badge badge-hit">HIT</span>' : ''}
        </span>
      </div>
    `).join('');
  }

  // ── Search filter ──────────────────────────────────────────────────────────
  document.getElementById('search').addEventListener('input', function() {
    const q = this.value.toLowerCase();
    const filtered = q ? allPlayers.filter(p => p.name.toLowerCase().includes(q)) : allPlayers;
    renderList(filtered);
  });

  // ── Player selection ───────────────────────────────────────────────────────
  function selectPlayer(player) {
    selectedPlayer = player;

    // Update display
    const disp = document.getElementById('selected-display');
    disp.textContent = player.name;
    disp.classList.add('active');

    // Enable/disable buttons based on available markets
    document.getElementById('btn-hit').disabled = !player.has_hit;
    document.getElementById('btn-hr').disabled  = !player.has_hr;

    // Re-render list to show selection
    const q = document.getElementById('search').value.toLowerCase();
    const filtered = q ? allPlayers.filter(p => p.name.toLowerCase().includes(q)) : allPlayers;
    renderList(filtered);

    // Hide result from previous trade
    document.getElementById('result').style.display = 'none';

    // Scroll player list to show selected, then close keyboard
    document.getElementById('search').blur();
  }

  // ── Trade ──────────────────────────────────────────────────────────────────
  async function trade(type) {
    if (!selectedPlayer) return;

    const btn = type === 'hit' ? document.getElementById('btn-hit') : document.getElementById('btn-hr');
    btn.disabled = true;

    const resultEl = document.getElementById('result');
    resultEl.className = 'loading';
    resultEl.style.display = 'block';
    resultEl.innerHTML = '<div class="spinner"></div>';

    // Haptic feedback (iOS/Android)
    if (navigator.vibrate) navigator.vibrate(50);

    const t0 = Date.now();
    try {
      const resp = await fetch('/api/trade', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          player_name: selectedPlayer.name.toLowerCase(),
          trade_type: type,
        }),
      });

      const d = await resp.json();
      const roundtrip = Date.now() - t0;

      if (!resp.ok) {
        resultEl.className = 'error';
        resultEl.innerHTML = `
          <div class="result-title error-title">❌ ${d.detail || 'Trade failed'}</div>
          <div class="result-row"><span class="label">Player</span><span class="value">${selectedPlayer.name}</span></div>
          <div class="result-row"><span class="label">Type</span><span class="value">${type}</span></div>
        `;
      } else {
        resultEl.className = 'success';
        const label = type === 'home_run' ? '⚾ HOME RUN' : '🔵 HIT';
        resultEl.innerHTML = `
          <div class="result-title">${d.paper ? '[PAPER] ' : ''}${label} — ${d.player}</div>
          <div class="result-row"><span class="label">Ticker</span><span class="value" style="font-size:12px">${d.ticker}</span></div>
          <div class="result-row"><span class="label">Contracts</span><span class="value">${d.contracts} @ ${d.avg_price_cents}¢</span></div>
          <div class="result-row"><span class="label">Cost</span><span class="value">$${d.cost_usd.toFixed(2)}</span></div>
          <div class="result-row"><span class="label">Expected P&L</span><span class="value green">+$${d.expected_pnl_usd.toFixed(2)}</span></div>
          <div class="result-row"><span class="label">Latency</span><span class="value">${d.latency_ms}ms server / ${roundtrip}ms total</span></div>
        `;

        // Refresh balance after trade
        loadBalance();
      }
    } catch(e) {
      resultEl.className = 'error';
      resultEl.innerHTML = `<div class="result-title error-title">❌ Network error — check connection</div>`;
    }

    // Re-enable button
    btn.disabled = (type === 'hit' ? !selectedPlayer?.has_hit : !selectedPlayer?.has_hr);
  }

  init();
  // Refresh balance every 30 seconds
  setInterval(loadBalance, 30000);
</script>
</body>
</html>
